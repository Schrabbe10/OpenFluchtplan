[package]
name = "openfluchtplan"
version = "0.1.0"
edition = "2024"
description = "Flucht- und Rettungspläne (DIN ISO 23601), Feuerwehrpläne (DIN 14095) und Laufkarten erstellen"
license = "Unlicense"
repository = "https://github.com/Schrabbe10/OpenFluchtplan"

[[bin]]
name = "OpenFluchtplan"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[dependencies]
base64 = "0.23.1"
dxf = "0.6.2"
earcutr = "0.5.0"
hayro = "0.9.0"
i_overlay = "9.1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
pdf-writer = "=0.12.1"
qrcode = "0.14.1"
resvg = "=0.45.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svg2pdf = "0.13.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

# Desktop (Windows)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
open = "5.4.5"
rfd = "0.17.2"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "gzip"] }

# Browser (WebAssembly)
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Storage", "Location"] }
console_error_panic_hook = "0.1"
# Zufallsquelle im Browser für Unterabhängigkeiten
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
