<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenFluchtplan</title>
  <meta name="description" content="Freie Software zum Erstellen von Flucht- und Rettungsplänen nach ISO-Normen – läuft direkt im Browser, die Pläne verlassen den Rechner nicht.">
  <link data-trunk rel="rust" data-bin="OpenFluchtplan" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f4; font-family: Arial, Helvetica, sans-serif; }
    #openfluchtplan { position: absolute; inset: 0; width: 100%; height: 100%; }
    #laden { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #333; text-align: center; padding: 16px; }
    #laden b { color: #1f7a4d; font-size: 22px; }
  </style>
</head>
<body>
  <canvas id="openfluchtplan"></canvas>
  <div id="laden"><b>OpenFluchtplan</b><span>wird geladen …</span><small>Alles läuft in diesem Browser – Pläne werden nicht hochgeladen.</small></div>
</body>
</html>
